[project]
name = "procmap"
version = "0.1.0"
description = "Map BPM workflows as swimlane diagrams and check them for internal-control gaps."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
procmap = "procmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["procmap"]
